[package]
name = "catcher-ws"
version = "0.3.7"
edition = "2021"
description = "WebSocket client for catcher — resilient reconnect, heartbeat, multi-endpoint racing"
license = "MIT"
repository = "https://github.com/eric8810/catcher"

[features]
default = ["rustls-tls"]
rustls-tls = ["yawc/rustls-ring"]
native-tls = ["rustls-tls"]

[dependencies]
catcher-core = { path = "../catcher-core", version = "0.3.7" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
yawc = { version = "0.3.3", default-features = false }
futures-util = "0.3"
backon = "1"
rmp-serde = "1"
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
zstd = "0.13"
http = "1"

[dev-dependencies]
sha1 = "0.10"
