[workspace]
resolver = "2"
members = [
    "catcher-core",
    "catcher-dns",
    "catcher-test-support",
    "catcher-http",
    "catcher-ws",
    "catcher-ffi",
    "catcher-napi-http",
    "catcher-napi-ws",
    "catcher-uniffi",
]

# Planned: "catcher-tus",  (TUS client, to be created)

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
