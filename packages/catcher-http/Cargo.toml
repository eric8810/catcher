[package]
name = "catcher-http"
version = "0.3.1"
edition = "2021"
description = "HTTP client for catcher — resilient transport with retry, circuit breaker, priority scheduling"
license = "MIT"
repository = "https://github.com/eric8810/catcher"

[features]
default = ["rustls-tls", "hickory-dns"]
rustls-tls = ["reqwest/rustls", "dep:rustls", "dep:rustls-pki-types", "dep:sha2", "dep:webpki-roots"]
native-tls = ["reqwest/native-tls"]
hickory-dns = ["reqwest/hickory-dns", "dep:hickory-resolver", "dep:hickory-proto"]
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
catcher-core = { path = "../catcher-core", version = "0.3.1" }

# ── 异步运行时 ──
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "macros"] }
tokio-util = "0.7"
async-trait = "0.1"

# ── SSE streaming ──
tokio-stream = "0.1"
bytes = "1"

# ── HTTP 传输 ──
reqwest = { version = "0.13", default-features = false, features = [
    "http2", "gzip", "brotli", "deflate", "stream", "charset", "query", "form"
] }
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
retry-policies = "0.5"
http = "1"

# ── DNS 缓存 ──
hickory-resolver = { version = "0.25", optional = true, features = ["tokio"] }
hickory-proto = { version = "0.25", optional = true }

# ── TLS pinning (pulled in by rustls-tls) ──
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1", optional = true, features = ["std"] }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22" }
webpki-roots = { version = "0.26", optional = true }

# ── 重试与退避 ──
backon = "1"

# ── 序列化 ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── 工具 ──
parking_lot = "0.12"

# ── FFI (napi, 可选) ──
napi = { version = "2", optional = true, default-features = false, features = ["napi4", "tokio_rt", "serde-json"] }
napi-derive = { version = "2", optional = true }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
