[package]
name = "catcher-uniffi"
version = "0.2.1"
edition = "2021"
description = "UniFFI bindings for catcher — auto-generates Swift + Kotlin from Rust API"
license = "MIT"
repository = "https://github.com/eric8810/catcher"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "catcher_uniffi"

[dependencies]
catcher-http = { path = "../catcher-http", version = "0.2.1" }
catcher-ws = { path = "../catcher-ws", version = "0.2.1" }
uniffi = { version = "0.28", features = ["cli"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
