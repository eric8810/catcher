[package]
name = "catcher-napi-http"
version = "0.3.0"
edition = "2021"
description = "catcher HTTP napi-rs Node.js native bindings"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
catcher-core = { path = "../catcher-core", version = "0.3.0" }
catcher-http = { path = "../catcher-http", version = "0.3.0" }
napi = { version = "2", default-features = false, features = ["napi4", "tokio_rt", "serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-util = "0.7"
bytes = "1"
base64 = "0.22"
tokio-stream = "0.1"

[build-dependencies]
napi-build = "2"
