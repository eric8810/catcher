[package]
name = "catcher-napi-http"
version = "0.2.0"
edition = "2021"
description = "catcher HTTP napi-rs Node.js native bindings"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
catcher-core = { path = "../catcher-core" }
catcher-http = { path = "../catcher-http" }
napi = { version = "2", default-features = false, features = ["napi4", "tokio_rt", "serde-json"] }
napi-derive = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2"
