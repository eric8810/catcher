name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'catcher_core-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # 1. npm TS packages (catcher-core/http/ws/web)
  # ──────────────────────────────────────────────
  publish-npm-ts:
    if: "!startsWith(github.ref, 'refs/tags/catcher_core-v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install
      - run: pnpm build
      - run: pnpm --filter @eric8810/catcher-core publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm --filter @eric8810/catcher-http publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm --filter @eric8810/catcher-ws publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm --filter @eric8810/catcher-web publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ──────────────────────────────────────────────
  # 2. napi native packages (cross-platform)
  #
  # Platforms (8 total):
  #   defaults:   win32-x64-msvc, darwin-x64, linux-x64-gnu
  #   additional: darwin-arm64, linux-x64-musl, linux-arm64-gnu,
  #               linux-arm64-musl, win32-arm64-msvc
  # ──────────────────────────────────────────────
  publish-napi-http:
    if: "!startsWith(github.ref, 'refs/tags/catcher_core-v')"
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-zig: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-zig: true
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages -> target
      - name: Install musl tools
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install zig (for cross-compilation)
        if: matrix.settings.use-zig
        uses: mlugg/setup-zig@v2
      - run: pnpm install
      - name: Ensure cargo path (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV
          echo "CARGO=$HOME/.cargo/bin/cargo" >> $GITHUB_ENV
          which cargo
          cargo --version
      - name: Build native addon
        shell: bash
        run: |
          cd packages/catcher-napi-http
          ZIG_FLAG=""
          if [ "${{ matrix.settings.use-zig }}" = "true" ]; then
            ZIG_FLAG="--zig"
          fi
          pnpm exec napi build --platform --release --target ${{ matrix.settings.target }} $ZIG_FLAG
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-http-${{ matrix.settings.target }}
          path: |
            packages/catcher-napi-http/*.node
            packages/catcher-napi-http/index.d.ts
          retention-days: 1

  publish-napi-ws:
    if: "!startsWith(github.ref, 'refs/tags/catcher_core-v')"
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-zig: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-zig: true
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages -> target
      - name: Install musl tools
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install zig (for cross-compilation)
        if: matrix.settings.use-zig
        uses: mlugg/setup-zig@v2
      - run: pnpm install
      - name: Ensure cargo path (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV
          echo "CARGO=$HOME/.cargo/bin/cargo" >> $GITHUB_ENV
          which cargo
          cargo --version
      - name: Build native addon
        shell: bash
        run: |
          cd packages/catcher-napi-ws
          ZIG_FLAG=""
          if [ "${{ matrix.settings.use-zig }}" = "true" ]; then
            ZIG_FLAG="--zig"
          fi
          pnpm exec napi build --platform --release --target ${{ matrix.settings.target }} $ZIG_FLAG
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-ws-${{ matrix.settings.target }}
          path: packages/catcher-napi-ws/*.node
          retention-days: 1

  publish-napi-assemble:
    needs: [publish-napi-http, publish-napi-ws]
    if: always() && !startsWith(github.ref, 'refs/tags/catcher_core-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install
      - name: Download all napi artifacts
        uses: actions/download-artifact@v4
        with:
          path: napi-artifacts
          merge-multiple: false
      - name: Abort if no artifacts were produced
        run: |
          HTTP_COUNT=$(find napi-artifacts -name "*.node" -path "*/napi-http-*" 2>/dev/null | wc -l)
          WS_COUNT=$(find napi-artifacts -name "*.node" -path "*/napi-ws-*" 2>/dev/null | wc -l)
          echo "napi-http .node files: $HTTP_COUNT"
          echo "napi-ws .node files: $WS_COUNT"
          if [ "$HTTP_COUNT" -eq 0 ] && [ "$WS_COUNT" -eq 0 ]; then
            echo "::error::No .node artifacts found — all build jobs failed. Aborting publish."
            exit 1
          fi

      # ── catcher-napi-http ──
      - name: Place napi-http artifacts
        run: |
          for dir in napi-artifacts/napi-http-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/*.node packages/catcher-napi-http/ || true
            cp "$dir"/index.d.ts packages/catcher-napi-http/ || true
          done
          echo "=== .node files in catcher-napi-http ==="
          ls -lh packages/catcher-napi-http/*.node || true
      - name: Create napi-http sub-package dirs and distribute binaries
        run: |
          cd packages/catcher-napi-http
          pnpm exec napi create-npm-dir -t .
          for f in *.node; do
            [ -f "$f" ] || continue
            platform="${f%.node}"
            platform="${platform#*.}"
            if [ -d "npm/$platform" ]; then
              cp "$f" "npm/$platform/"
              echo "  $f -> npm/$platform/"
            else
              echo "  WARN: no npm/$platform dir for $f"
            fi
          done
      - name: Build napi-http TS wrappers
        run: pnpm --filter @eric8810/catcher-napi-http build:ts
      - name: Prepublish napi-http (update optionalDeps + publish sub-packages)
        run: |
          cd packages/catcher-napi-http
          pnpm exec napi prepublish --skip-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish catcher-napi-http main package
        run: |
          cd packages/catcher-napi-http
          npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── catcher-napi-ws ──
      - name: Place napi-ws artifacts
        run: |
          for dir in napi-artifacts/napi-ws-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/*.node packages/catcher-napi-ws/ || true
          done
          echo "=== .node files in catcher-napi-ws ==="
          ls -lh packages/catcher-napi-ws/*.node || true
      - name: Create napi-ws sub-package dirs and distribute binaries
        run: |
          cd packages/catcher-napi-ws
          pnpm exec napi create-npm-dir -t .
          for f in *.node; do
            [ -f "$f" ] || continue
            platform="${f%.node}"
            platform="${platform#*.}"
            if [ -d "npm/$platform" ]; then
              cp "$f" "npm/$platform/"
              echo "  $f -> npm/$platform/"
            else
              echo "  WARN: no npm/$platform dir for $f"
            fi
          done
      - name: Build napi-ws TS wrappers
        run: pnpm --filter @eric8810/catcher-napi-ws build:ts
      - name: Prepublish napi-ws (update optionalDeps + publish sub-packages)
        run: |
          cd packages/catcher-napi-ws
          pnpm exec napi prepublish --skip-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish catcher-napi-ws main package
        run: |
          cd packages/catcher-napi-ws
          npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ──────────────────────────────────────────────
  # 3. Rust crates (crates.io)
  # ──────────────────────────────────────────────
  publish-rust:
    if: "!startsWith(github.ref, 'refs/tags/catcher_core-v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages -> target
      # Publish in dependency order (tolerate already-published versions)
      - name: Publish catcher-core
        run: cd packages/catcher-core && cargo publish || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish catcher-http
        run: cd packages/catcher-http && cargo publish || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish catcher-ws
        run: cd packages/catcher-ws && cargo publish || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish catcher-ffi
        run: cd packages/catcher-ffi && cargo publish || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish catcher-uniffi
        run: cd packages/catcher-uniffi && cargo publish || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ──────────────────────────────────────────────
  # 4. Flutter (pub.dev) — OIDC auto-publish
  # ──────────────────────────────────────────────
  publish-flutter:
    if: startsWith(github.ref, 'refs/tags/catcher_core-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Publish catcher_core
        working-directory: packages/catcher_core
        run: dart pub publish --force
