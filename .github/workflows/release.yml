name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'catcher_core-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # 1. npm TS packages (catcher-core/http/ws/web)
  # ──────────────────────────────────────────────
  publish-npm-ts:
    if: "!startsWith(github.ref, 'refs/tags/catcher_core-v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install
      - run: pnpm build
      - run: pnpm --filter @eric8810/catcher-core publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm --filter @eric8810/catcher-http publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm --filter @eric8810/catcher-ws publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm --filter @eric8810/catcher-web publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ──────────────────────────────────────────────
  # 2. napi native packages (cross-platform)
  #
  # Platforms (8 total):
  #   defaults:   win32-x64-msvc, darwin-x64, linux-x64-gnu
  #   additional: darwin-arm64, linux-x64-musl, linux-arm64-gnu,
  #               linux-arm64-musl, win32-arm64-msvc
  # ──────────────────────────────────────────────
  publish-napi-http:
    if: "!startsWith(github.ref, 'refs/tags/catcher_core-v')"
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-zig: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-zig: true
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages -> target
      - name: Install musl tools
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install zig (for cross-compilation)
        if: matrix.settings.use-zig
        uses: mlugg/setup-zig@v2
      - run: pnpm install
      - name: Ensure cargo path (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV
          echo "CARGO=$HOME/.cargo/bin/cargo" >> $GITHUB_ENV
          which cargo
          cargo --version
      - name: Build native addon
        shell: bash
        run: |
          cd packages/catcher-napi-http
          ZIG_FLAG=""
          if [ "${{ matrix.settings.use-zig }}" = "true" ]; then
            ZIG_FLAG="--zig"
          fi
          pnpm exec napi build --platform --release --target ${{ matrix.settings.target }} $ZIG_FLAG
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-http-${{ matrix.settings.target }}
          path: |
            packages/catcher-napi-http/*.node
            packages/catcher-napi-http/index.d.ts
          retention-days: 1

  publish-napi-ws:
    if: "!startsWith(github.ref, 'refs/tags/catcher_core-v')"
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-zig: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-zig: true
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages -> target
      - name: Install musl tools
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install zig (for cross-compilation)
        if: matrix.settings.use-zig
        uses: mlugg/setup-zig@v2
      - run: pnpm install
      - name: Ensure cargo path (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV
          echo "CARGO=$HOME/.cargo/bin/cargo" >> $GITHUB_ENV
          which cargo
          cargo --version
      - name: Build native addon
        shell: bash
        run: |
          cd packages/catcher-napi-ws
          ZIG_FLAG=""
          if [ "${{ matrix.settings.use-zig }}" = "true" ]; then
            ZIG_FLAG="--zig"
          fi
          pnpm exec napi build --platform --release --target ${{ matrix.settings.target }} $ZIG_FLAG
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-ws-${{ matrix.settings.target }}
          path: packages/catcher-napi-ws/*.node
          retention-days: 1

  publish-napi-assemble:
    needs: [publish-napi-http, publish-napi-ws]
    if: "!startsWith(github.ref, 'refs/tags/catcher_core-v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install
      - name: Download all napi artifacts
        uses: actions/download-artifact@v4
        with:
          path: napi-artifacts
          merge-multiple: false
      - name: Verify napi artifacts
        run: |
          set -euo pipefail
          targets=(
            "x86_64-unknown-linux-gnu"
            "x86_64-unknown-linux-musl"
            "aarch64-unknown-linux-gnu"
            "aarch64-unknown-linux-musl"
            "aarch64-apple-darwin"
            "x86_64-apple-darwin"
            "x86_64-pc-windows-msvc"
            "aarch64-pc-windows-msvc"
          )

          count_node_files() {
            local dir="$1"
            if [ ! -d "$dir" ]; then
              echo 0
              return 0
            fi
            find "$dir" -maxdepth 1 -name "*.node" | wc -l | tr -d ' '
          }

          HTTP_COUNT=$(find napi-artifacts -name "*.node" -path "*/napi-http-*" 2>/dev/null | wc -l)
          WS_COUNT=$(find napi-artifacts -name "*.node" -path "*/napi-ws-*" 2>/dev/null | wc -l)
          echo "napi-http .node files: $HTTP_COUNT"
          echo "napi-ws .node files: $WS_COUNT"

          missing=0
          for target in "${targets[@]}"; do
            http_files=$(count_node_files "napi-artifacts/napi-http-$target")
            ws_files=$(count_node_files "napi-artifacts/napi-ws-$target")
            if [ "$http_files" -ne 1 ]; then
              echo "::error::Expected 1 napi-http .node artifact for $target, found $http_files"
              missing=1
            fi
            if [ "$ws_files" -ne 1 ]; then
              echo "::error::Expected 1 napi-ws .node artifact for $target, found $ws_files"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # ── catcher-napi-http ──
      - name: Place napi-http artifacts
        run: |
          for dir in napi-artifacts/napi-http-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/*.node packages/catcher-napi-http/ || true
            cp "$dir"/index.d.ts packages/catcher-napi-http/ || true
          done
          echo "=== .node files in catcher-napi-http ==="
          ls -lh packages/catcher-napi-http/*.node || true
      - name: Create napi-http sub-package dirs and distribute binaries
        run: |
          cd packages/catcher-napi-http
          pnpm exec napi create-npm-dir -t .
          for f in *.node; do
            [ -f "$f" ] || continue
            platform="${f%.node}"
            platform="${platform#*.}"
            if [ -d "npm/$platform" ]; then
              cp "$f" "npm/$platform/"
              echo "  $f -> npm/$platform/"
            else
              echo "  WARN: no npm/$platform dir for $f"
            fi
          done
      - name: Build napi-http TS wrappers
        run: pnpm --filter @eric8810/catcher-napi-http build:ts
      - name: Prepublish napi-http (update optionalDeps + publish sub-packages)
        run: |
          cd packages/catcher-napi-http
          pnpm exec napi prepublish --skip-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish catcher-napi-http main package
        run: |
          cd packages/catcher-napi-http
          npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── catcher-napi-ws ──
      - name: Place napi-ws artifacts
        run: |
          for dir in napi-artifacts/napi-ws-*; do
            [ -d "$dir" ] || continue
            cp "$dir"/*.node packages/catcher-napi-ws/ || true
          done
          echo "=== .node files in catcher-napi-ws ==="
          ls -lh packages/catcher-napi-ws/*.node || true
      - name: Create napi-ws sub-package dirs and distribute binaries
        run: |
          cd packages/catcher-napi-ws
          pnpm exec napi create-npm-dir -t .
          for f in *.node; do
            [ -f "$f" ] || continue
            platform="${f%.node}"
            platform="${platform#*.}"
            if [ -d "npm/$platform" ]; then
              cp "$f" "npm/$platform/"
              echo "  $f -> npm/$platform/"
            else
              echo "  WARN: no npm/$platform dir for $f"
            fi
          done
      - name: Build napi-ws TS wrappers
        run: pnpm --filter @eric8810/catcher-napi-ws build:ts
      - name: Prepublish napi-ws (update optionalDeps + publish sub-packages)
        run: |
          cd packages/catcher-napi-ws
          pnpm exec napi prepublish --skip-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish catcher-napi-ws main package
        run: |
          cd packages/catcher-napi-ws
          npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ──────────────────────────────────────────────
  # 3. Rust crates (crates.io)
  # ──────────────────────────────────────────────
  publish-rust:
    if: "!startsWith(github.ref, 'refs/tags/catcher_core-v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages -> target
      - name: Publish Rust crates
        working-directory: packages
        shell: bash
        run: |
          set -euo pipefail

          publish_crate() {
            local crate_dir="$1"
            local attempts=5

            for attempt in $(seq 1 "$attempts"); do
              echo "Publishing $crate_dir (attempt $attempt/$attempts)"
              set +e
              output=$(cd "$crate_dir" && cargo publish 2>&1)
              status=$?
              set -e
              echo "$output"

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if echo "$output" | grep -Eiq "already (uploaded|exists)|crate version .* is already uploaded"; then
                echo "$crate_dir is already published; continuing."
                return 0
              fi

              if [ "$attempt" -lt "$attempts" ]; then
                echo "Publish failed; waiting for crates.io index before retrying."
                sleep 60
              else
                return "$status"
              fi
            done
          }

          publish_crate catcher-core
          publish_crate catcher-dns
          publish_crate catcher-http
          publish_crate catcher-ws
          publish_crate catcher-ffi
          publish_crate catcher-uniffi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ──────────────────────────────────────────────
  # 4. Flutter catcher_core — build native binaries
  # ──────────────────────────────────────────────
  build-native-android:
    if: startsWith(github.ref, 'refs/tags/catcher_core-v')
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: "27.0.12077973"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
      CARGO_PROFILE_RELEASE_PANIC: "abort"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages -> target"
      - name: Install Android NDK
        run: sdkmanager "ndk;$ANDROID_NDK_VERSION"
      - name: Build for all Android ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLCHAIN/armv7a-linux-androideabi24-clang"
          export CARGO_TARGET_I686_LINUX_ANDROID_LINKER="$TOOLCHAIN/i686-linux-android24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/x86_64-linux-android24-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CC_armv7_linux_androideabi="$TOOLCHAIN/armv7a-linux-androideabi24-clang"
          export CC_i686_linux_android="$TOOLCHAIN/i686-linux-android24-clang"
          export CC_x86_64_linux_android="$TOOLCHAIN/x86_64-linux-android24-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"
          export AR_armv7_linux_androideabi="$TOOLCHAIN/llvm-ar"
          export AR_i686_linux_android="$TOOLCHAIN/llvm-ar"
          export AR_x86_64_linux_android="$TOOLCHAIN/llvm-ar"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cd packages
          cargo build --release -p catcher-ffi --target aarch64-linux-android
          cargo build --release -p catcher-ffi --target armv7-linux-androideabi
          cargo build --release -p catcher-ffi --target i686-linux-android
          cargo build --release -p catcher-ffi --target x86_64-linux-android
          "$TOOLCHAIN/llvm-strip" --strip-unneeded target/aarch64-linux-android/release/libcatcher_ffi.so
          "$TOOLCHAIN/llvm-strip" --strip-unneeded target/armv7-linux-androideabi/release/libcatcher_ffi.so
          "$TOOLCHAIN/llvm-strip" --strip-unneeded target/i686-linux-android/release/libcatcher_ffi.so
          "$TOOLCHAIN/llvm-strip" --strip-unneeded target/x86_64-linux-android/release/libcatcher_ffi.so
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-native
          path: |
            packages/target/aarch64-linux-android/release/libcatcher_ffi.so
            packages/target/armv7-linux-androideabi/release/libcatcher_ffi.so
            packages/target/i686-linux-android/release/libcatcher_ffi.so
            packages/target/x86_64-linux-android/release/libcatcher_ffi.so
          retention-days: 1

  build-native-ios:
    if: startsWith(github.ref, 'refs/tags/catcher_core-v')
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
      CARGO_PROFILE_RELEASE_PANIC: "abort"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages -> target"
      - name: Build for iOS device
        run: |
          rustup target add aarch64-apple-ios
          cd packages
          cargo build --release -p catcher-ffi --target aarch64-apple-ios
          xcrun strip -x target/aarch64-apple-ios/release/libcatcher_ffi.dylib
      - name: Build for iOS simulator
        run: |
          rustup target add aarch64-apple-ios-sim x86_64-apple-ios
          cd packages
          cargo build --release -p catcher-ffi --target aarch64-apple-ios-sim
          cargo build --release -p catcher-ffi --target x86_64-apple-ios
          xcrun strip -x target/aarch64-apple-ios-sim/release/libcatcher_ffi.dylib
          xcrun strip -x target/x86_64-apple-ios/release/libcatcher_ffi.dylib
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-native
          path: |
            packages/target/aarch64-apple-ios/release/libcatcher_ffi.dylib
            packages/target/aarch64-apple-ios-sim/release/libcatcher_ffi.dylib
            packages/target/x86_64-apple-ios/release/libcatcher_ffi.dylib
          retention-days: 1

  build-native-macos:
    if: startsWith(github.ref, 'refs/tags/catcher_core-v')
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
      CARGO_PROFILE_RELEASE_PANIC: "abort"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages -> target"
      - name: Build for macOS
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cd packages
          cargo build --release -p catcher-ffi --target aarch64-apple-darwin
          cargo build --release -p catcher-ffi --target x86_64-apple-darwin
          xcrun strip -x target/aarch64-apple-darwin/release/libcatcher_ffi.dylib
          xcrun strip -x target/x86_64-apple-darwin/release/libcatcher_ffi.dylib
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-native
          path: |
            packages/target/aarch64-apple-darwin/release/libcatcher_ffi.dylib
            packages/target/x86_64-apple-darwin/release/libcatcher_ffi.dylib
          retention-days: 1

  build-native-windows:
    if: startsWith(github.ref, 'refs/tags/catcher_core-v')
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
      CARGO_PROFILE_RELEASE_PANIC: "abort"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages -> target"
      - name: Build for Windows
        run: |
          cd packages && cargo build --release -p catcher-ffi --target x86_64-pc-windows-msvc
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-native
          path: packages/target/x86_64-pc-windows-msvc/release/catcher_ffi.dll
          retention-days: 1

  build-native-linux:
    if: startsWith(github.ref, 'refs/tags/catcher_core-v')
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
      CARGO_PROFILE_RELEASE_PANIC: "abort"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages -> target"
      - name: Install Linux cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Build for Linux
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          cd packages
          cargo build --release -p catcher-ffi --target x86_64-unknown-linux-gnu
          cargo build --release -p catcher-ffi --target aarch64-unknown-linux-gnu
          strip --strip-unneeded target/x86_64-unknown-linux-gnu/release/libcatcher_ffi.so
          aarch64-linux-gnu-strip --strip-unneeded target/aarch64-unknown-linux-gnu/release/libcatcher_ffi.so
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-native
          path: |
            packages/target/x86_64-unknown-linux-gnu/release/libcatcher_ffi.so
            packages/target/aarch64-unknown-linux-gnu/release/libcatcher_ffi.so
          retention-days: 1

  # ──────────────────────────────────────────────
  # 5. Flutter (pub.dev) — assemble + publish
  # ──────────────────────────────────────────────
  publish-flutter:
    needs: [build-native-android, build-native-ios, build-native-macos, build-native-windows, build-native-linux]
    if: startsWith(github.ref, 'refs/tags/catcher_core-v')
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dart-lang/setup-dart@v1

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts

      - name: Create platform bundle directories
        run: |
          mkdir -p packages/catcher_core/android/src/main/jniLibs/arm64-v8a
          mkdir -p packages/catcher_core/android/src/main/jniLibs/armeabi-v7a
          mkdir -p packages/catcher_core/android/src/main/jniLibs/x86
          mkdir -p packages/catcher_core/android/src/main/jniLibs/x86_64
          mkdir -p packages/catcher_core/ios/Frameworks
          mkdir -p packages/catcher_core/macos/Frameworks
          mkdir -p packages/catcher_core/linux/lib/arm64
          mkdir -p packages/catcher_core/linux/lib/x64
          mkdir -p packages/catcher_core/windows/lib/x64

      - name: Copy Android binaries
        run: |
          copy_one() {
            local pattern="$1"
            local dest="$2"
            local src
            src=$(find native-artifacts -path "$pattern" -type f | head -n 1)
            test -n "$src"
            cp "$src" "$dest"
          }

          copy_one "*/aarch64-linux-android/release/libcatcher_ffi.so" packages/catcher_core/android/src/main/jniLibs/arm64-v8a/libcatcher_ffi.so
          copy_one "*/armv7-linux-androideabi/release/libcatcher_ffi.so" packages/catcher_core/android/src/main/jniLibs/armeabi-v7a/libcatcher_ffi.so
          copy_one "*/i686-linux-android/release/libcatcher_ffi.so" packages/catcher_core/android/src/main/jniLibs/x86/libcatcher_ffi.so
          copy_one "*/x86_64-linux-android/release/libcatcher_ffi.so" packages/catcher_core/android/src/main/jniLibs/x86_64/libcatcher_ffi.so

      - name: Assemble Apple XCFrameworks
        run: |
          find_one() {
            local pattern="$1"
            local src
            src=$(find native-artifacts -path "$pattern" -type f | head -n 1)
            test -n "$src"
            echo "$src"
          }

          make_framework() {
            local src="$1"
            local dst="$2"
            local bundle_id="$3"
            local minimum_os_key="$4"
            local minimum_os_version="$5"
            rm -rf "$dst"
            mkdir -p "$dst"
            cp "$src" "$dst/catcher_ffi"
            install_name_tool -id "@rpath/catcher_ffi.framework/catcher_ffi" "$dst/catcher_ffi"
            xcrun strip -x "$dst/catcher_ffi"
            cat > "$dst/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>catcher_ffi</string>
            <key>CFBundleIdentifier</key>
            <string>${bundle_id}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>catcher_ffi</string>
            <key>CFBundlePackageType</key>
            <string>FMWK</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>${minimum_os_key}</key>
            <string>${minimum_os_version}</string>
          </dict>
          </plist>
          PLIST
          }

          IOS_DEVICE=$(find_one "*/aarch64-apple-ios/release/libcatcher_ffi.dylib")
          IOS_SIM_ARM64=$(find_one "*/aarch64-apple-ios-sim/release/libcatcher_ffi.dylib")
          IOS_SIM_X64=$(find_one "*/x86_64-apple-ios/release/libcatcher_ffi.dylib")
          lipo -create "$IOS_SIM_ARM64" "$IOS_SIM_X64" -output "$RUNNER_TEMP/libcatcher_ffi_ios_sim.dylib"
          make_framework "$IOS_DEVICE" "$RUNNER_TEMP/ios-device/catcher_ffi.framework" "com.eric8810.catcher.ffi.ios" "MinimumOSVersion" "$IPHONEOS_DEPLOYMENT_TARGET"
          make_framework "$RUNNER_TEMP/libcatcher_ffi_ios_sim.dylib" "$RUNNER_TEMP/ios-simulator/catcher_ffi.framework" "com.eric8810.catcher.ffi.ios-simulator" "MinimumOSVersion" "$IPHONEOS_DEPLOYMENT_TARGET"
          xcodebuild -create-xcframework \
            -framework "$RUNNER_TEMP/ios-device/catcher_ffi.framework" \
            -framework "$RUNNER_TEMP/ios-simulator/catcher_ffi.framework" \
            -output packages/catcher_core/ios/Frameworks/catcher_ffi.xcframework

          MACOS_ARM64=$(find_one "*/aarch64-apple-darwin/release/libcatcher_ffi.dylib")
          MACOS_X64=$(find_one "*/x86_64-apple-darwin/release/libcatcher_ffi.dylib")
          lipo -create "$MACOS_ARM64" "$MACOS_X64" -output "$RUNNER_TEMP/libcatcher_ffi_macos.dylib"
          make_framework "$RUNNER_TEMP/libcatcher_ffi_macos.dylib" "$RUNNER_TEMP/macos/catcher_ffi.framework" "com.eric8810.catcher.ffi.macos" "LSMinimumSystemVersion" "$MACOSX_DEPLOYMENT_TARGET"
          xcodebuild -create-xcframework \
            -framework "$RUNNER_TEMP/macos/catcher_ffi.framework" \
            -output packages/catcher_core/macos/Frameworks/catcher_ffi.xcframework

      - name: Copy Windows binaries
        run: |
          cp native-artifacts/windows-native/catcher_ffi.dll packages/catcher_core/windows/lib/x64/catcher_ffi.dll

      - name: Copy Linux binaries
        run: |
          copy_one() {
            local pattern="$1"
            local dest="$2"
            local src
            src=$(find native-artifacts -path "$pattern" -type f | head -n 1)
            test -n "$src"
            cp "$src" "$dest"
          }

          copy_one "*/x86_64-unknown-linux-gnu/release/libcatcher_ffi.so" packages/catcher_core/linux/lib/x64/libcatcher_ffi.so
          copy_one "*/aarch64-unknown-linux-gnu/release/libcatcher_ffi.so" packages/catcher_core/linux/lib/arm64/libcatcher_ffi.so

      - name: Verify platform bundles
        run: |
          du -sh packages/catcher_core/android/src/main/jniLibs
          du -sh packages/catcher_core/ios/Frameworks
          du -sh packages/catcher_core/macos/Frameworks
          du -sh packages/catcher_core/linux/lib
          du -sh packages/catcher_core/windows/lib
          find packages/catcher_core/android/src/main/jniLibs -type f | sort
          find packages/catcher_core/ios/Frameworks -type f | sort
          find packages/catcher_core/macos/Frameworks -type f | sort
          find packages/catcher_core/linux/lib -type f | sort
          find packages/catcher_core/windows/lib -type f | sort
          test "$(plutil -extract MinimumOSVersion raw packages/catcher_core/ios/Frameworks/catcher_ffi.xcframework/ios-arm64/catcher_ffi.framework/Info.plist)" = "$IPHONEOS_DEPLOYMENT_TARGET"
          test "$(plutil -extract MinimumOSVersion raw packages/catcher_core/ios/Frameworks/catcher_ffi.xcframework/ios-arm64_x86_64-simulator/catcher_ffi.framework/Info.plist)" = "$IPHONEOS_DEPLOYMENT_TARGET"
          test "$(plutil -extract LSMinimumSystemVersion raw packages/catcher_core/macos/Frameworks/catcher_ffi.xcframework/macos-arm64_x86_64/catcher_ffi.framework/Info.plist)" = "$MACOSX_DEPLOYMENT_TARGET"

      - name: Check catcher_core package
        working-directory: packages/catcher_core
        run: dart pub publish --dry-run

      - name: Publish catcher_core
        working-directory: packages/catcher_core
        run: dart pub publish --force
