name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build:ts
      - run: pnpm typecheck

  test:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build:ts
      - run: pnpm test

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages -> target"
      - run: cd packages && cargo check --workspace
      - run: cd packages && cargo clippy --workspace --all-targets -- -D warnings
      # `cargo test --workspace` 使用各 crate 默认 features：catcher-http 默认含
      # `hickory-dns`、catcher-ws 始终启用 `reqwest-resolver`，因此 proxy_dns_behavior_test
      # 会在此运行。这是「代理路径目标域名不被本地解析」对 reqwest 内部行为依赖的唯一护栏
      # （见 docs/arch-rs/04-transport.md，issue #031）。升级 reqwest 时务必确认其通过。
      #
      # `--no-fail-fast`：默认 cargo test 在第一个失败的测试二进制处停止，会让单个 flaky
      # 测试（如 catcher-ffi quality_test）掩盖后续整个套件的执行结果（issue #033）。
      - run: cd packages && cargo test --workspace --no-fail-fast

  dart-ffi-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages -> target"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build catcher-ffi .so
        run: cd packages && cargo build --release -p catcher-ffi
      - name: Install Dart dependencies
        run: |
          cd packages/catcher_core
          flutter pub get
      - name: Run FFI roundtrip tests
        env:
          CATCHER_FFI_PATH: ${{ github.workspace }}/packages/target/release/libcatcher_ffi.so
        run: |
          cd packages/catcher_core
          flutter test test/ffi_roundtrip_test.dart
