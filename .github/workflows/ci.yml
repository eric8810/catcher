name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build:ts
      - run: pnpm typecheck

  test:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build:ts
      - run: pnpm test

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages -> target"
      - run: cd packages && cargo check --workspace
      - run: cd packages && cargo test --workspace

  dart-ffi-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "packages -> target"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build catcher-ffi .so
        run: cd packages && cargo build --release -p catcher-ffi
      - name: Install Dart dependencies
        run: |
          cd packages/catcher_core
          flutter pub get
      - name: Run FFI roundtrip tests
        env:
          CATCHER_FFI_PATH: ${{ github.workspace }}/packages/target/release/libcatcher_ffi.so
        run: |
          cd packages/catcher_core
          flutter test test/ffi_roundtrip_test.dart
